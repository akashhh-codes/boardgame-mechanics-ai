[project]
name = "ai-board-game-ontology"
version = "0.1.0"
description = "AI-driven board game ontology extraction and semantic design tool."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Akash Chauhan" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent"
]

keywords = ["board game", "ontology", "semantic search", "RAG", "streamlit"]
dependencies = [
    "streamlit>=1.30.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=2.2.0",
    "keybert>=0.8.0",
    "umap-learn>=0.5.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
    "PyMuPDF>=1.23.0",
    "spacy>=3.5.0",
    "matplotlib>=3.7.0",
    "rdflib>=6.0.0",
    "google-genai>=2.14.0",
    "requests>=2.28.0",
    "beautifulsoup4>=4.12.0",
    "pdfplumber>=0.10.0",
    "pdf2image>=1.16.0",
    "transformers>=4.40.0",
    "torch>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pre-commit>=4.5.0"
]

[tool.setuptools.packages.find]
include = ["shared", "semantic_engine", "knowledge_extraction"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
